name: tests

#run test case for task1,2,3 when code pushed 
on:
  push:
  pull_request:
  workflow_dispatch:

  jobs:
    test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"
            cache: pip

        - name: Install dependencies
        #mock Gemma tests
          run: |
            grep -vE '^(torch|transformers|huggingface-hub|pyinstaller)==' requirements.txt > ci-requirements.txt
            pip install -r ci-requirements.txt
            hadolint --version 

        - name: Run test cases (Task-1, Task-2, Task-3)
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-log
            path: test-log.txt

    binary:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - uses: actions/checkout@v5
          with:
            python-version: "3.12"
        - name: Smoke-test the binary
          run: ./dist/tbd/ --help
        - uses: actions/upload-artifact@v4
          with:
            name: tbd
            path: tbd
