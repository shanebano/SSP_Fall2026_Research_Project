name: tests

# Runs the Task-1, Task-2 and Task-3 test cases on every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Gemma is mocked in the tests, so the heavy model and build libraries are skipped.
      - name: Install dependencies
        run: |
          grep -vE '^(torch|transformers|huggingface-hub|pyinstaller)==' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
          hadolint --version

      - name: Run tests
        run: |
          set -o pipefail
          pytest -v 2>&1 | tee test-log.txt

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test-log.txt
